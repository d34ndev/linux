services:
  mysql:
    image: docker.io/library/mysql:8.4
    container_name: mysql
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "true"
    volumes:
      - mysql-data:/var/lib/mysql
    restart: always
  redis:
    image: docker.io/library/redis:8
    container_name: redis
    ports:
      - "127.0.0.1:6379:6379"
    restart: always

volumes:
  mysql-data:
